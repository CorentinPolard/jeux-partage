## HTTP server - redirect to HTTPS except ACME challenge
server {
    listen 80;
    server_name jeuxpartage.fr www.jeuxpartage.fr;

    # Allow Let's Encrypt HTTP-01 challenge to succeed
    location /.well-known/acme-challenge/ {
        # Certbot (webroot) will place challenge files under this path.
        # Make sure to mount a volume to /var/www/certbot from the host or certbot container.
        root /var/www/certbot;
        try_files $uri =404;
    }

    # All other requests -> redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

## HTTPS server
server {
    listen 443 ssl http2;
    server_name jeuxpartage.fr www.jeuxpartage.fr;

    root /app/public;
    index index.php;
    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # SSL certs - replace these paths with your real certificate locations
    ssl_certificate /etc/letsencrypt/live/jeuxpartage.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeuxpartage.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Tell PHP/Symfony that the request is HTTPS when passing to PHP-FPM
        fastcgi_param HTTPS on;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}